# FE: phục vụ codebase/static/ và chuyển /api/ sang BE (be:8000). Cloudflare Tunnel (cloudflared) gọi vào đây.

# Sau Cloudflare, IP thật của khách nằm ở CF-Connecting-IP; gọi thẳng từ máy (127.0.0.1:8080) thì dùng remote_addr.
map $http_cf_connecting_ip $khach {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
# IP thật dạng chữ để chuyển cho web.py (X-Real-IP); $khach ở trên là dạng nhị phân, chỉ dùng làm khoá đếm.
map $http_cf_connecting_ip $ip_that {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
# Cloudflare → cloudflared đặt X-Forwarded-Proto=https; gọi thẳng 127.0.0.1:8080 thì là http. Ghi đè, không chuyển nguyên.
map $http_x_forwarded_proto $j97_proto {
    https   https;
    default $scheme;
}
# /api/moi (hội thoại mới), /api/tra-loi (khách trả lời, chạy lại agent), /api/nhan-them (NAP_NEN: AI xử lý 5 tin mới),
# /api/chat/gui (khách đăng nhập gửi tin, bot chạy agent) gọi model trả tiền:
# dùng chung zone ai, tổng 6 lần/phút mỗi IP. Đăng ký / đăng nhập: zone tk 5 lần/phút. Các API khác 120 lần/phút.
limit_req_zone $khach zone=ai:10m  rate=6r/m;
limit_req_zone $khach zone=tk:10m  rate=5r/m;
limit_req_zone $khach zone=api:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;   # khớp GIOI_HAN_POST_MOI (~0,7 MB) của web.py

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api/(moi|tra-loi|nhan-them|chat/gui)$ {
        limit_req zone=ai burst=3 nodelay;
        proxy_pass http://be:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location ~ ^/api/(dang-ky|dang-nhap)$ {
        limit_req zone=tk burst=5 nodelay;
        proxy_pass http://be:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://be:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
